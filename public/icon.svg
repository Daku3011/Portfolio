<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12151D" />
      <stop offset="100%" stop-color="#090A0C" />
    </linearGradient>
    <linearGradient id="mint-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3EF0A8" />
      <stop offset="100%" stop-color="#2EE59D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#2EE59D" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Plate with Rounded Corners -->
  <rect width="512" height="512" rx="108" fill="url(#bg-grad)" />
  <rect x="10" y="10" width="492" height="492" rx="98" fill="none" stroke="#222631" stroke-width="14" />

  <!-- Subtle Tactical Crosshairs -->
  <path d="M 44 72 L 72 72 M 72 44 L 72 72" stroke="#313746" stroke-width="6" stroke-linecap="round" />
  <path d="M 468 72 L 440 72 M 440 44 L 440 72" stroke="#313746" stroke-width="6" stroke-linecap="round" />
  <path d="M 44 440 L 72 440 M 72 468 L 72 440" stroke="#313746" stroke-width="6" stroke-linecap="round" />
  <path d="M 468 440 L 440 440 M 440 468 L 440 440" stroke="#313746" stroke-width="6" stroke-linecap="round" />

  <!-- Active Telemetry Status Beacon -->
  <circle cx="420" cy="92" r="14" fill="#2EE59D" filter="url(#glow)" />
  <circle cx="420" cy="92" r="26" fill="none" stroke="#2EE59D" stroke-width="3" opacity="0.35" />

  <!-- Geometric Monogram "DR" (Dwarkesh Ramani) -->
  <g transform="translate(68, 126)">
    <!-- Letter 'D' -->
    <path d="M 0 0 L 110 0 C 175 0 215 36 215 130 C 215 224 175 260 110 260 L 0 260 Z M 58 54 L 58 206 L 102 206 C 138 206 156 182 156 130 C 156 78 138 54 102 54 Z" fill="#F3F4F6" />

    <!-- Letter 'R' (With Electric Mint Diagonal Accent Leg) -->
    <path d="M 210 0 L 310 0 C 352 0 376 22 376 74 C 376 118 352 138 316 142 L 382 260 L 318 260 L 260 152 L 260 260 L 210 260 Z M 260 50 L 260 108 L 298 108 C 318 108 326 98 326 79 C 326 60 318 50 298 50 Z" fill="#2EE59D" filter="url(#glow)" />
  </g>

  <!-- Bottom Telemetry Micro-line -->
  <line x1="80" y1="432" x2="280" y2="432" stroke="#222631" stroke-width="6" stroke-linecap="round" />
  <circle cx="298" cy="432" r="5" fill="#2EE59D" />
</svg>